# Frontend entry on <YOUR_FRONTEND_IP>:<PORT>
# Backend API on <YOUR_BACKEND_IP>:<PORT>
#
# Usage:
# 1. Build frontend with `pnpm build`
# 2. Deploy `dist/` to the directory configured by `root`
# 3. Keep `.env.production` using same-origin API access:
#    VITE_GLOB_API_URL=
#    VITE_GLOB_API_URL_PREFIX=/api
# 4. Reload Nginx after enabling this server block

upstream cz_backend {
  server <YOUR_BACKEND_IP>:3000;
  keepalive 32;
}

server {
  listen <PORT>;
  server_name <YOUR_FRONTEND_IP_OR_DOMAIN>;

  root /var/www/cz-official/dist;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://cz_backend/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /uploads/ {
    proxy_pass http://cz_backend/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
